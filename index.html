<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#17142b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="아스트라 RPG - 사냥하고, 뽑고, 합성하는 성장형 RPG">
  <title>아스트라 RPG</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
  <style>
:root {
  --bg: #0f0d1a;
  --panel: #1b1830;
  --panel2: #252141;
  --line: #3a3460;
  --text: #ece9ff;
  --dim: #9a94c2;
  --accent: #ffcc4d;
  --accent2: #8b5cf6;
  --good: #4ade80;
  --bad: #f87171;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(ellipse at top, #241d45, var(--bg) 60%) fixed, var(--bg);
  color: var(--text);
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  font-size: 14px;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
#app {
  max-width: 760px; margin: 0 auto; height: 100dvh;
  display: flex; flex-direction: column; position: relative;
  background: rgba(15, 13, 26, .55);
  box-shadow: 0 0 60px rgba(0, 0, 0, .5);
}

/* ----- 상단 바 ----- */
#top { padding: 10px 12px 8px; background: linear-gradient(#1f1a3a, #17142b); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 8px; }
.lv-badge { background: var(--accent2); border-radius: 10px; padding: 3px 8px; font-weight: 800; font-size: 13px; }
.expbar { flex: 1; height: 8px; background: #0b0a14; border-radius: 6px; overflow: hidden; }
.expbar > i { display: block; height: 100%; background: linear-gradient(90deg, #8b5cf6, #c084fc); width: 0; transition: width .3s; }
.power { font-weight: 800; color: var(--accent); font-size: 13px; }
.res { display: flex; gap: 6px; margin-top: 8px; }
.res span { flex: 1; background: #0b0a14; border-radius: 9px; padding: 4px 8px; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ----- 메인 ----- */
#main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px; }
#main.no-pad { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
h2 { margin: 2px 0 10px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
h3 { margin: 14px 0 8px; font-size: 15px; color: var(--dim); }
.muted { color: var(--dim); font-size: 12.5px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }

/* ----- 하단 네비 ----- */
#nav { display: flex; border-top: 1px solid var(--line); background: #15122a; padding-bottom: env(safe-area-inset-bottom); }
#nav button { flex: 1; background: none; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--dim); position: relative; }
#nav button b { font-size: 20px; line-height: 1; }
#nav button.on { color: var(--accent); }
#nav button.on::before { content: ''; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.dot::after { content: ''; position: absolute; top: 6px; right: 26%; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

/* ----- 버튼 ----- */
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px; font-weight: 700; transition: transform .08s, filter .15s; }
.btn:active { transform: scale(.96); }
.btn.gold { background: linear-gradient(#ffd96b, #f0a92e); color: #3b2300; border-color: #ffe39a; }
.btn.purple { background: linear-gradient(#a78bfa, #7c3aed); border-color: #c4b5fd; }
.btn.red { background: linear-gradient(#f87171, #b91c1c); border-color: #fca5a5; }
.btn.green { background: linear-gradient(#4ade80, #15803d); border-color: #86efac; color: #052e12; }
.btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 9px; }
.btn.block { width: 100%; }
.btn:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
.tabs button { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; color: var(--dim); white-space: nowrap; }
.tabs button.on { background: var(--accent2); color: #fff; border-color: #c4b5fd; }

/* ----- 마을 ----- */
.town-hero { height: 190px; border-radius: var(--radius); position: relative; overflow: hidden; margin-bottom: 12px;
  background: linear-gradient(#5b8def 0%, #a5c8ff 55%, #78c27a 56%, #3d8a4a 100%); border: 1px solid var(--line); }
.town-hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.town-title { position: absolute; left: 12px; top: 10px; font-weight: 900; font-size: 20px; text-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
.town-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.bld { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 6px 10px; text-align: center; position: relative; }
.bld b { display: block; font-size: 30px; margin-bottom: 4px; }
.bld span { font-weight: 800; font-size: 13px; }
.bld small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
.bld.dot::after { top: 8px; right: 8px; }
.offline-card { display: flex; align-items: center; gap: 10px; }

/* ----- 전투 ----- */
.battle-head { padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px; }
.stage-name { font-weight: 800; }
.boss-prog { flex: 1; height: 10px; background: #0b0a14; border-radius: 6px; overflow: hidden; }
.boss-prog i { display: block; height: 100%; background: linear-gradient(90deg, #f97316, #facc15); }
#battle { flex: 1; position: relative; min-height: 260px; touch-action: manipulation; }
#battle canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.battle-ui { padding: 8px 12px 12px; display: grid; grid-template-columns: 1fr 64px 64px; gap: 8px; }
.atk-btn { height: 74px; border-radius: 18px; font-size: 20px; font-weight: 900; background: linear-gradient(#fb7185, #be123c); border: 2px solid #fecdd3; box-shadow: 0 5px 0 #881337; }
.atk-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #881337; }
.sq-btn { height: 74px; border-radius: 16px; background: var(--panel2); border: 1px solid var(--line); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.sq-btn b { font-size: 26px; line-height: 1.1; }
.sq-btn .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, .65); }
.hpbar { height: 12px; background: #0b0a14; border-radius: 7px; overflow: hidden; position: relative; }
.hpbar i { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, #86efac); transition: width .15s; }
.hpbar span { position: absolute; inset: 0; font-size: 9.5px; text-align: center; line-height: 12px; font-weight: 800; text-shadow: 0 1px 2px #000; }
.player-hp { padding: 0 12px; }
.battle-sub { display: flex; gap: 6px; padding: 6px 12px 0; }
.battle-sub .btn { flex: 1; }

/* ----- 아이템 ----- */
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 7px; }
.it { aspect-ratio: 1; border-radius: 11px; border: 2px solid; position: relative; display: flex; align-items: center; justify-content: center; font-size: 26px; background: #120f22; }
.it .e { position: absolute; top: 2px; right: 4px; font-size: 10.5px; font-weight: 900; text-shadow: 0 1px 2px #000; }
.it .t { position: absolute; bottom: 2px; left: 4px; font-size: 9.5px; font-weight: 800; opacity: .85; }
.it .lk { position: absolute; top: 14px; left: 3px; font-size: 9px; }
.it .eq { position: absolute; bottom: 2px; right: 3px; font-size: 9px; background: var(--accent); color: #000; border-radius: 4px; padding: 0 3px; font-weight: 900; }
.it .cnt { position: absolute; bottom: 2px; right: 4px; font-size: 11px; font-weight: 900; text-shadow: 0 1px 2px #000; }
.it.sel { outline: 3px solid #fff; outline-offset: -1px; }
.it.off { opacity: .28; }
.it.empty { border-style: dashed; border-color: var(--line); color: var(--dim); font-size: 22px; }
.g-glow { box-shadow: 0 0 12px currentColor inset; }

/* ----- 장비창 ----- */
.eq-wrap { display: grid; grid-template-columns: 70px 1fr 70px; gap: 8px; align-items: center; }
.eq-col { display: flex; flex-direction: column; gap: 8px; }
.eq-col .it { width: 70px; }
.hero-box { height: 240px; position: relative; border-radius: var(--radius); background: radial-gradient(circle at 50% 60%, #3b2f6e, #15122a 70%); border: 1px solid var(--line); }
.hero-box canvas { width: 100%; height: 100%; display: block; }
.stat-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.stat-list div { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; border-bottom: 1px dashed #2c2850; }
.stat-list b { color: var(--accent); }
.skin-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.skin-row .it { font-size: 22px; }

/* ----- 모달 ----- */
#modal { position: fixed; inset: 0; background: rgba(5, 3, 15, .72); display: none; align-items: flex-end; justify-content: center; z-index: 50; backdrop-filter: blur(3px); }
#modal.show { display: flex; }
.sheet { width: 100%; max-width: 520px; max-height: 88dvh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.sheet-head .it { width: 64px; flex: none; }
.sheet-head h3 { margin: 0; color: var(--text); font-size: 17px; }
.kv { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #2c2850; font-size: 13px; }
.kv b { color: var(--accent); }
.cmp-up { color: var(--good); font-weight: 800; }
.cmp-down { color: var(--bad); font-weight: 800; }

/* ----- 뽑기 ----- */
.gacha-stage { height: 170px; border-radius: var(--radius); margin-bottom: 10px; background: radial-gradient(circle at 50% 55%, #8b5cf6 0%, #3b1d6e 45%, #140b2a 80%); display: flex; align-items: center; justify-content: center; font-size: 74px; position: relative; overflow: hidden; border: 1px solid #6d4fc2; }
.gacha-stage::before { content: ''; position: absolute; inset: -50%; background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, .12), transparent 30%); animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.rates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font-size: 12px; }
.rates div { background: #120f22; border-radius: 7px; padding: 4px 6px; display: flex; justify-content: space-between; }
.pull-res { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.pull-res .it { animation: pop .35s backwards; }
@keyframes pop { from { transform: scale(0) rotate(-20deg); opacity: 0; } }
.new-tag { position: absolute; top: -5px; left: 50%; transform: translateX(-50%); background: var(--bad); font-size: 8.5px; font-weight: 900; padding: 0 4px; border-radius: 4px; }

/* ----- 합성 ----- */
.synth-slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 8px 0; }

/* ----- 상점 ----- */
.shop-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.shop-item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
.shop-item b { font-size: 30px; }
.shop-item .n { font-weight: 800; }
.test-badge { display: inline-block; background: #7f1d1d; color: #fecaca; border-radius: 6px; padding: 2px 6px; font-size: 11px; font-weight: 800; }

/* ----- 토스트 ----- */
#toasts { position: fixed; top: 128px; left: 50%; transform: translateX(-50%); width: min(440px, 92vw); z-index: 60; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { align-self: center; max-width: 100%; background: rgba(27, 24, 48, .94); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: 12.5px; animation: tin .25s; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
.toast.good { border-color: var(--good); }
.toast.bad { border-color: var(--bad); }
.toast.rare { border-color: var(--accent); background: linear-gradient(90deg, rgba(120, 70, 10, .95), rgba(27, 24, 48, .96)); }
@keyframes tin { from { transform: translateY(-10px); opacity: 0; } }

textarea { width: 100%; min-height: 90px; background: #0b0a14; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: 11px; }
select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; font: inherit; }

/* ================= 마을 로비 ================= */
body.full-mode #app { max-width: none; }
body.full-mode #top, body.full-mode #nav { display: none; }
body.full-mode #main { padding: 0; overflow: hidden; position: relative; }
body.full-mode #toasts { top: 84px; }
.lobby {
  --ic: clamp(40px, min(9.5vh, 12.5vw), 66px);
  --ink: #3b2108;
  position: absolute; inset: 0; overflow: hidden;
  font-family: 'Black Han Sans', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}
.lobby > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lobby button { background: none; padding: 0; font-family: inherit; }
.stroke {
  color: #fff; letter-spacing: .5px;
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink),
    1.5px 1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 0 3px 3px rgba(0, 0, 0, .4);
}
.c-gold { color: #ffd36b; font-weight: 800; }

/* 상단 HUD */
.l-top { position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right));
  display: flex; align-items: flex-start; gap: 10px; z-index: 2; }
.profile { display: flex; align-items: center; gap: 10px; padding: 5px 26px 5px 5px; cursor: pointer;
  background: linear-gradient(90deg, rgba(58, 34, 18, .92) 60%, rgba(58, 34, 18, 0)); border-radius: 14px; }
.avatar { width: calc(var(--ic) * .95); height: calc(var(--ic) * .95); border-radius: 12px; border: 3px solid #f3d27a; box-shadow: 0 0 0 2px var(--ink); flex: none; }
.p-info { min-width: 0; }
.p-name { font-size: 18px; line-height: 1.15; }
.p-lv { font-size: 13px; color: #ffe7a8; font-family: system-ui, sans-serif; font-weight: 800; }
.p-exp { width: clamp(90px, 14vw, 170px); height: 13px; margin-top: 3px; background: #1a0f06; border: 1px solid #6b4a1f; border-radius: 3px; position: relative; overflow: hidden; }
.p-exp i { display: block; height: 100%; background: linear-gradient(#ffcf6b, #e08a1e); }
.p-exp span { position: absolute; inset: 0; text-align: center; font: 800 10px/13px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000; }
.pills { display: flex; gap: 10px; flex: 1; justify-content: center; flex-wrap: wrap; padding-top: 6px; }
.pill { display: flex; align-items: center; height: 32px; min-width: 128px; background: linear-gradient(#4a2e18, #2c1a0c); border: 2px solid #8a6230; border-radius: 9px;
  position: relative; padding: 0 4px 0 30px; font: 800 15px system-ui, sans-serif; color: #fff2d0; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .08); }
.pill i { position: absolute; left: -10px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 30px; filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .6)); }
.pill span { flex: 1; text-align: right; padding-right: 6px; font-variant-numeric: tabular-nums; }
.pill button { width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(#ffd96b, #e09a22) !important; color: var(--ink); font: 900 18px/22px system-ui; border: 1px solid #fff2b0; }
.l-icons { display: flex; gap: 6px; }
.ibtn { width: calc(var(--ic) * .82); height: calc(var(--ic) * .82); font-size: calc(var(--ic) * .55); border-radius: 12px; background: linear-gradient(#5b3a1f, #33200f) !important;
  border: 2px solid #c9a25a !important; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5)); }

/* 전광판 */
.ticker { position: absolute; z-index: 2; right: max(8px, env(safe-area-inset-right)); top: calc(max(8px, env(safe-area-inset-top)) + var(--ic) + 6px); max-width: min(62%, 640px);
  background: rgba(24, 20, 34, .78); border: 1px solid rgba(255, 255, 255, .12); border-radius: 12px; padding: 6px 14px; overflow: hidden;
  font: 700 13.5px system-ui, sans-serif; color: #f2eefc; white-space: nowrap; text-overflow: ellipsis; }
.ticker span { display: inline-block; animation: tick .5s ease-out; }
.ticker b { color: #ff7a7a; }
@keyframes tick { from { transform: translateY(100%); opacity: 0; } }

/* 좌우 아이콘 */
.l-side { position: absolute; z-index: 2; top: calc(max(8px, env(safe-area-inset-top)) + var(--ic) + 48px); display: flex; flex-direction: column; gap: clamp(2px, 1.2vh, 12px); }
.l-side.left { left: max(10px, env(safe-area-inset-left)); }
.l-side.right { right: max(10px, env(safe-area-inset-right)); }
.sbtn { position: relative; display: flex; flex-direction: column; align-items: center; width: calc(var(--ic) * 1.25); }
.sbtn b { font-size: calc(var(--ic) * .72); line-height: 1.05; filter: drop-shadow(0 3px 2px rgba(40, 20, 0, .55)); transition: transform .15s; }
.sbtn span { font-size: clamp(12px, calc(var(--ic) * .27), 17px); margin-top: -4px; white-space: nowrap; }
.sbtn:hover b, .rbtn:hover b { transform: translateY(-3px) scale(1.06); }
.sbtn:active b, .rbtn:active b { transform: scale(.92); }
.sbtn.dot::after, .rbtn.dot::after { top: 2px; right: 14%; width: 12px; height: 12px; border: 2px solid #fff; }

/* 하단 메뉴 */
.l-dock { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 10px;
  padding: 0 max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.rrow { display: flex; gap: clamp(4px, 1.4vw, 18px); flex: 1.6; justify-content: flex-start; }
.brow { display: flex; gap: 10px; flex: 1; justify-content: flex-end; }
.rbtn { position: relative; display: flex; flex-direction: column; align-items: center; }
.rbtn b { width: calc(var(--ic) * 1.18); height: calc(var(--ic) * 1.18); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--ic) * .7); transition: transform .15s;
  background: radial-gradient(circle at 50% 35%, #fff1c2, #e8b75a 55%, #a8661c); border: 3px solid #7a4a14;
  box-shadow: 0 0 0 2px #f6dc93, 0 4px 0 #5a3410, 0 6px 8px rgba(0, 0, 0, .4); }
.rbtn span { font-size: clamp(13px, calc(var(--ic) * .32), 21px); margin-top: -10px; position: relative; }
.big-btn { position: relative; flex: 1; max-width: 260px; height: calc(var(--ic) * 1.35); border-radius: 14px; display: flex; align-items: center; justify-content: flex-end; padding-right: 18px;
  border: 3px solid #e2b24f !important; box-shadow: 0 0 0 2px var(--ink), 0 5px 0 #3a1e08, 0 8px 12px rgba(0, 0, 0, .45); transition: transform .1s; }
.big-btn.dungeon { background: linear-gradient(160deg, #8a4b2a, #4a2410) !important; }
.big-btn.adventure { background: linear-gradient(160deg, #2f7a8a, #12384a) !important; }
.big-btn::before { content: ''; position: absolute; inset: 5px; border: 1px dashed rgba(255, 230, 170, .35); border-radius: 9px; pointer-events: none; }
.big-btn b { position: absolute; left: -6px; bottom: 4px; font-size: calc(var(--ic) * 1.2); filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .5)); }
.big-btn span { font-size: clamp(22px, calc(var(--ic) * .62), 40px); color: #ffe7a8; }
.big-btn small { position: absolute; top: 4px; right: 10px; font-size: 12px; color: #c7f3ff; }
.big-btn:active { transform: translateY(3px); }

/* 세로 화면: 하단 메뉴를 두 줄로 */
@media (max-aspect-ratio: 1/1) {
  .lobby { --ic: clamp(38px, 11vw, 56px); }
  .l-top { flex-wrap: wrap; }
  .pills { order: 3; flex-basis: 100%; justify-content: space-between; gap: 6px; padding-top: 2px; }

}

/* 출석 / 퀘스트 */
.attend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

.quest { display: flex; gap: 10px; align-items: center; background: #120f22; border: 1px solid var(--line); border-radius: 11px; padding: 9px 10px; margin-bottom: 6px; }

/* ================= 영웅 수집 ================= */
.mt { margin: 0 0 8px; color: var(--text); font-size: 17px; }
.sheet.wide { max-width: 760px; }
.inp { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #0b0a14; color: var(--text); font: inherit; font-size: 16px; }
.cg { display: inline-block; padding: 1px 6px; border-radius: 5px; font: 900 11px/16px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.5); vertical-align: middle; }
.stars { color: #ffd23f; letter-spacing: -1px; font-size: 12px; }
.stars i { color: rgba(255,255,255,.18); font-style: normal; }
.btn.big { padding: 14px; font-size: 16px; margin-top: 10px; }
.tabs.mini button { padding: 4px 10px; font-size: 12px; }
canvas.bust { display: block; width: 100%; height: 100%; }

.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.hcard { position: relative; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; cursor: pointer; border: 2px solid var(--gc);
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 4px 10px rgba(0,0,0,.35); transition: transform .12s; background: #120f22; }
.hcard:active { transform: scale(.96); }
.hcard.sel { box-shadow: 0 0 0 3px #fff, 0 0 16px var(--gc); }

.hcard .cg { position: absolute; top: 5px; left: 5px; }
.hcard .role { position: absolute; top: 4px; right: 5px; font-size: 15px; filter: drop-shadow(0 1px 2px #000); }
.hcard .pbadge { position: absolute; top: 26px; left: 5px; background: var(--accent); color: #2a1800; font: 900 10px/15px system-ui; padding: 0 5px; border-radius: 4px; }

.hc-info small { font-size: 11px; color: #ddd; }

/* 영웅 상세 */
.hd { display: grid; gap: 12px; }
@media (min-width: 640px) { .hd { grid-template-columns: 300px 1fr; align-items: start; } .hd-stage { position: sticky; top: 0; } }
.hd-stage { position: relative; height: 380px; border-radius: 16px; overflow: hidden; border: 2px solid var(--gc);
  background: radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--gc) 45%, #1a1530), #120f22 75%); }
.hd-stage canvas { width: 100%; height: 100%; display: block; }

.hd-name small { font-family: system-ui; font-size: 12px; color: #e8e2ff; text-shadow: 0 1px 3px #000; }

.cos-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.cos { position: relative; border-radius: 12px; border: 2px solid var(--line); background: #120f22; overflow: hidden; cursor: pointer; padding-bottom: 6px; text-align: center; }

.cos .eq { position: absolute; top: 5px; right: 5px; background: var(--accent); color: #000; font: 900 10px/15px system-ui; padding: 0 5px; border-radius: 4px; }
.pick-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; background: #120f22; border: 1px solid var(--line); margin-bottom: 6px; cursor: pointer; }

/* 파티 */
.pslots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pslot { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; border: 2px solid var(--gc); background: #120f22; cursor: pointer; }

.party-mini { display: flex; gap: 6px; align-items: center; margin-top: 10px; }

/* 스테이지 지도 */
.stage-map { display: grid; grid-template-columns: repeat(5, minmax(0, 84px)); justify-content: space-around; gap: 10px; padding: 14px; border-radius: 16px; margin-bottom: 10px;
  background: linear-gradient(160deg, var(--g1), var(--g2)); border: 1px solid var(--line); }
.snode { aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff6d5, #d9a441 60%, #8a5a1f); border: 3px solid #5a3410 !important;

.snode.clr { background: radial-gradient(circle at 50% 35%, #e8fff0, #4ade80 60%, #15803d); }
.snode.boss { background: radial-gradient(circle at 50% 35%, #ffe0e0, #f87171 60%, #991b1b); color: #fff; }

/* 전투 */
body.full-mode #main { padding: 0; overflow: hidden; position: relative; }

body.full-mode #top, body.full-mode #nav { display: none; }
.bt { position: absolute; inset: 0; overflow: hidden; }
.bt > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.bt-title { font: 20px 'Black Han Sans', sans-serif; flex: 1; --ink: #2a1a10; }
.bt-timer { position: absolute; left: 50%; transform: translateX(-50%); background: linear-gradient(#6b3d1d, #3e220f); border: 3px solid #e2b24f; border-radius: 0 0 22px 22px;
  padding: 2px 18px 4px; text-align: center; top: -10px; box-shadow: 0 4px 10px rgba(0,0,0,.4); }

.bt-ctrl { display: flex; gap: 6px; align-items: center; }

.cbtn { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(#5a3a1f, #2c1a0c) !important; border: 2px solid #c9a25a !important; font: 900 12px system-ui; color: #ffe7a8; }

.skbtn { position: relative; width: clamp(58px, 9vw, 84px); aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 3px solid var(--gc) !important; padding: 0;
  background: #120f22; box-shadow: 0 4px 10px rgba(0,0,0,.45); transition: transform .1s; }

@media (max-aspect-ratio: 1/1) {

/* 결과 */
.result { text-align: center; }
.r-title { font: 46px 'Black Han Sans', sans-serif; letter-spacing: 2px; }

.r-rw { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }

/* 뽑기 */
.banner { position: relative; height: 210px; border-radius: 16px; overflow: hidden; border: 2px solid #ffd36b; }
.hero-banner { background: radial-gradient(circle at 70% 40%, #ff7ab8 0%, #6a3ad8 45%, #160b33 85%); }

.banner::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 40px, rgba(255,255,255,.06) 40px 42px); pointer-events: none; }

.cos-banner { background: linear-gradient(110deg, #7fd6ff 0%, #bfefff 28%, #d8283a 30%, #8a1a2a 55%, #3a1f55 57%, #1a0f2a 100%); }
.bn-txt { position: absolute; left: 14px; bottom: 14px; z-index: 1; font-family: 'Black Han Sans', sans-serif; --ink: #2a1048; }

.bn-txt small { font: 700 12px system-ui; color: #fff; text-shadow: 0 1px 3px #000; }
.pull-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.pr { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; border: 2px solid var(--gc); background: #120f22; animation: pop .4s backwards; box-shadow: 0 0 14px color-mix(in srgb, var(--gc) 50%, transparent); }

.cutin { position: absolute; left: 0; right: 0; top: 34%; height: 92px; pointer-events: none; z-index: 3; opacity: 0; }

  75% { opacity: 1; transform: translateX(4%) skewX(-12deg); } 100% { opacity: 0; transform: translateX(40%) skewX(-12deg); } }
.ci-band { position: relative; height: 100%; width: min(620px, 92%); margin: 0 auto; overflow: hidden;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--gc) 75%, #120a2a) 15%, color-mix(in srgb, var(--gc) 55%, #120a2a) 85%, transparent);
  border-top: 2px solid rgba(255,255,255,.8); border-bottom: 2px solid rgba(255,255,255,.8); }

.sk-tag { display: inline-block; font: 800 10px/16px system-ui; padding: 0 6px; border-radius: 4px; background: #3b6fd8; margin-bottom: 4px; }

/* 레이드 */
.big-btn.raid { background: linear-gradient(160deg, #7a2a8a, #2a0f3a) !important; }
.big-btn.dot::after { top: -4px; right: -4px; width: 14px; height: 14px; border: 2px solid #fff; }
.raid-card { display: grid; grid-template-columns: minmax(0, 1fr); border-radius: 16px; overflow: hidden; border: 2px solid var(--rc); background: var(--panel); margin-bottom: 12px; }
@media (min-width: 600px) { .raid-card { grid-template-columns: 300px 1fr; } }
.dragon-cv { width: 100%; height: 200px; display: block; }
.rc-body { padding: 12px; }
.rc-name { font: 20px 'Black Han Sans', sans-serif; font-weight: 400; }
.tiers { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }

.xbar.big { height: 14px; margin: 6px 0 3px; border-radius: 7px; }

.rh { position: relative; }
.lvup { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font: 900 10px system-ui; color: #ffe14a; text-shadow: 0 1px 2px #000, 0 0 6px #f59e0b; animation: rdy .6s infinite alternate; }

/* 잠재능력 */

.slot-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }

/* ===== 뽑기 등급 연출: 뒷면은 모두 같고, 터치해서 열면 등급 빛 ===== */
.pr { perspective: 600px; cursor: pointer; }
/* 뒷면 등급 힌트: R·SR 은회색 / SSR 이상 금색 / UR 금색 + 붉은 아우라 */
.pr.fx0:not(.open), .pr.fx1:not(.open) { border-color: #9aa3b0 !important; box-shadow: 0 0 6px rgba(160,170,185,.3) !important; }

@keyframes urAura { from { box-shadow: 0 0 10px #ffc83d, 0 0 24px rgba(255,45,45,.8), 0 0 40px rgba(255,45,45,.4); } to { box-shadow: 0 0 18px #ffe08a, 0 0 40px #ff2d2d, 0 0 70px rgba(255,45,45,.85), 0 0 110px rgba(255,120,0,.6); } }
.pr:not(.open):hover { transform: translateY(-3px); }
.pr-back { position: absolute; inset: 0; z-index: 5; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: radial-gradient(circle at 50% 40%, #3a2a78, #1d1640 70%), #1d1640; border: 2px solid #8b7be0; color: #c4b5fd; font-size: 30px; backface-visibility: hidden; }
.pr-back::before { content: ''; position: absolute; inset: 6px; border: 1px dashed rgba(196,181,253,.35); border-radius: 7px; }
.pr-back small { font: 900 9px system-ui; letter-spacing: 2px; opacity: .7; }
.pr-back span { animation: prPulse .8s ease-in-out infinite alternate; }
.pr.open .pr-back { animation: prFlip .4s ease-in forwards; }
@keyframes prFlip { 0% { transform: rotateY(0); } 100% { transform: rotateY(90deg); opacity: 0; visibility: hidden; } }
@keyframes prPulse { to { transform: scale(1.2); opacity: .6; } }
.pr-beam { position: absolute; left: 10%; right: 10%; bottom: -10%; height: 0; z-index: 6; pointer-events: none; border-radius: 50% 50% 0 0;
  background: linear-gradient(to top, var(--fx), transparent); filter: blur(4px); opacity: 0; }
.pr.open .pr-beam { animation: prBeam .9s ease-out forwards; }
@keyframes prBeam { 0% { height: 0; opacity: 0; } 25% { opacity: .95; } 100% { height: 140%; opacity: 0; } }
.pr.open.fx0 { box-shadow: 0 0 8px rgba(184,192,204,.35); border-color: #9aa3b0; filter: saturate(.85); }
.pr.open.fx1 { box-shadow: 0 0 12px rgba(90,168,255,.55); }
.pr.open.fx2 { box-shadow: 0 0 18px rgba(255,200,61,.75); animation: glowGold 1.4s ease-in-out .4s infinite alternate; }
.pr.open.fx3 { box-shadow: 0 0 26px rgba(255,45,45,.9); border-width: 3px; animation: urShake .4s ease-in-out, glowRed 1s ease-in-out .4s infinite alternate; }
.pr.open.fx3 .pr-beam { left: -20%; right: -20%; filter: blur(6px); animation-duration: 1.2s; }
@keyframes glowGold { to { box-shadow: 0 0 30px rgba(255,200,61,.95); } }
@keyframes glowRed { to { box-shadow: 0 0 40px rgba(255,45,45,1), 0 0 80px rgba(255,45,45,.5); } }
@keyframes urShake { 25% { transform: translateX(-4px) rotate(-2deg); } 75% { transform: translateX(4px) rotate(2deg); } }
/* 시작 연출 (등급과 무관) */
.pull-intro { position: fixed; inset: 0; z-index: 70; pointer-events: none; display: flex; align-items: center; justify-content: center;
  animation: introOut .3s ease-in .6s forwards; background: radial-gradient(circle, rgba(139,92,246,.25), rgba(5,3,15,.85) 70%); }
.pull-intro .orb { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #a78bfa 45%, transparent 72%);
  box-shadow: 0 0 60px #8b5cf6, 0 0 120px #8b5cf6; animation: orbGrow .7s ease-in forwards; }
@keyframes orbGrow { 0% { transform: scale(.2); } 70% { transform: scale(1.1); } 100% { transform: scale(8); opacity: 0; } }
@keyframes introOut { to { opacity: 0; visibility: hidden; } }
/* 카드를 열었을 때 높은 등급 화면 연출 */
.reveal-flash { position: fixed; inset: 0; z-index: 80; pointer-events: none; display: flex; align-items: center; justify-content: center; animation: introOut .35s ease-in .7s forwards; }

/* UR을 터치했을 때만: 붉은 아우라가 휘몰아치며 흔들리다가 열림 */

@keyframes urCharge {
  0% { transform: scale(1); box-shadow: 0 0 14px rgba(255,200,61,.7); }
  20% { transform: scale(1.04) rotate(-1.5deg); box-shadow: 0 0 20px #ffc83d, 0 0 30px rgba(255,45,45,.6); }
  40% { transform: scale(1.06) rotate(1.5deg); }
  60% { transform: scale(1.08) rotate(-2.5deg); box-shadow: 0 0 26px #ff2d2d, 0 0 60px rgba(255,45,45,.85); }
  80% { transform: scale(1.1) rotate(2.5deg); }
  100% { transform: scale(1.12) rotate(0); box-shadow: 0 0 30px #fff, 0 0 70px #ff2d2d, 0 0 120px rgba(255,90,0,.8); }
}
.pr.charging .pr-back::after { content: ''; position: absolute; inset: -50%; z-index: 0;
  background: conic-gradient(from 0deg, transparent, rgba(255,40,40,.95), transparent 25%, rgba(255,220,90,.9), transparent 50%, rgba(255,40,40,.95), transparent 75%);
  mix-blend-mode: screen; animation: spin .6s linear infinite, auraIn 1.15s ease-in forwards; }

.ci-lines { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.0) 0 18px, rgba(255,255,255,.22) 18px 20px, rgba(255,255,255,0) 20px 46px); animation: ciLines .35s linear infinite; mix-blend-mode: screen; }

      const u = mobUnit(m.type, m.col, s, m.boss, m.name, m.boss ? .74 : .72 + (i % 2) * .12, ys[i], m.mul);
      if (m.raid) { u.raid = { key: m.raid, breathT: 5, warn: 0, rage: false }; u.x = u.hx = .8; u.y = u.hy = .66; u.defn = Math.floor(s * 2); }
      B.units.push(u);
      if (B.mode === 'tower') B.towerHp += u.max; // 이 층 몬스터 체력 합계 = 100%
    });
  }

  function float(u, txt, col, big) { B.floats.push({ x: u.x + G.rand(-.02, .02), y: u.y - .2, txt, col, big, life: 1 }); }

  // 피해 처리 (opts: big, basic, critBonus, forceCrit, counter, mult)
  function dealDmg(src, tgt, mult, opts) {
    opts = opts || {};
    if (!tgt || tgt.dead) return 0;
    let d = src.atk * mult * G.rand(.9, 1.1);
    const crit = opts.forceCrit || Math.random() * 100 < src.crit + (opts.critBonus || 0);
    if (crit) d *= src.critDmg / 100;
    if (src.passive === 'execute' && tgt.hp < tgt.max * .5) d *= 1.3;
    if (src.rageT > 0) d *= 1.3;
    if (src.pot && src.pot.bossDmg && tgt.boss) d *= 1 + src.pot.bossDmg / 100;
    if (tgt.pot) { // 잠재능력: 무적 / 회피 / 피해 무시 / 피해 감소
      const P = tgt.pot;
      if (tgt.invulT > 0) { if (!opts.silent) float(tgt, '무적', '#ffe14a'); return 0; }
      if (P.evade && Math.random() * 100 < P.evade) { float(tgt, 'MISS', '#bfe6ff'); return 0; }
      if (P.guard && Math.random() * 100 < P.guard) { float(tgt, '피해 무시', '#bfe6ff'); return 0; }
      if (P.reduce) d *= 1 - P.reduce / 100;
    }
    d *= 100 / (100 + tgt.defn);
    if (tgt.passive === 'reduce') d *= .8;
    if (tgt.reduceT > 0) d *= 1 - tgt.reduceP;
    d = Math.max(1, Math.floor(d));
    if (tgt.shield > 0) { const a = Math.min(tgt.shield, d); tgt.shield -= a; d -= a; }
    if (B.mode === 'tower' && tgt.side === 'm') B.dmgDealt += Math.min(d, Math.max(0, tgt.hp)); // 탑 점수 = 깎은 체력
    tgt.hp -= d; tgt.hit = 1;
    if (tgt.raid) B.dmgDealt += d;
    if (!opts.silent && d <= 0) float(tgt, '흡수', '#bfe6ff');
    else if (!opts.silent) float(tgt, (crit ? '💥' : '') + G.fmt(d), tgt.side === 'm' ? (crit ? '#ffd23f' : '#ffffff') : '#ff6b6b', crit || opts.big);
    if (opts.basic && src.passive === 'chill' && Math.random() < .15) { tgt.frozen = Math.max(tgt.frozen, tgt.raid ? .3 : 1); }
    if (tgt.hp > 0 && tgt.pot) {
      if (tgt.pot.invul && Math.random() * 100 < tgt.pot.invul) { tgt.invulT = 1; float(tgt, '무적!', '#ffe14a', true); }
      if (tgt.pot.rage && tgt.rageT <= 0 && Math.random() * 100 < tgt.pot.rage) { tgt.rageT = 3; float(tgt, '분노!', '#ff5d5d', true); }
    }
    if (tgt.hp <= 0) { tgt.hp = 0; tgt.dead = true; tgt.dying = .01; onDeath(tgt, src); }
    else if (tgt.passive === 'counter' && !opts.counter && !src.dead && Math.random() < .25) {
      float(tgt, '반격!', '#ffd36b'); tgt.anim = 1; dealDmg(tgt, src, 1, { counter: true });
    }
    return d;
  }
  function heal(u, amt, src) {
    if (u.dead) return;
    if (src && src.passive === 'healUp') amt *= 1.3;
    const a = Math.min(u.max - u.hp, Math.floor(amt));
    u.hp += a;
    if (a > 0) float(u, '+' + G.fmt(a), '#5bff9a');
  }

  function onDeath(u, killer) {
    const S = G.S;
    if (killer && killer.passive === 'vamp' && !killer.dead) heal(killer, killer.max * .15);
    if (u.side !== 'm') return;
    S.totalKills++; G.quest('kill');
    if (B.mode !== 'stage') return;
    const s = B.stage, st = G.calc(S);
    const gold = Math.floor(G.mobGold(s) * (u.boss ? 10 : 1) * (1 + st.goldBonus / 100));
    const exp = Math.floor(G.mobExp(s) * (u.boss ? 8 : 1) * (1 + st.expBonus / 100));
    S.gold += gold; B.earned.gold += gold; B.earned.exp += exp;
    G.gainExp(S, exp);
    if (Math.random() < (u.boss ? 1 : .1)) {
      const it = G.dropEquip(S, G.tierOf(s), u.boss, s + 1);
      if (it) { B.earned.items.push(it); G.UI.dropToast(it); }
    }
  }

  function nearest(u, list) {
    let best = null, bd = 9;
    list.forEach(o => { const d = Math.abs(o.x - u.x) + Math.abs(o.y - u.y) * .5; if (d < bd) { bd = d; best = o; } });
    return best;
  }
  const fx = (type, u, extra) => B.fx.push(Object.assign({ type, x: u.x, y: u.y, life: 1, seed: Math.random() }, extra || {}));

  // ---------- 캐릭터별 고유 스킬 ----------
  const SKILLS = {
    meteor(u, sk, foes) { // 세라핀: 유성 3연타
      for (let k = 0; k < sk.hits; k++) later(k * .28, () => alive(B.mobs()).forEach(f => { fx('meteor', f); later(.18, () => { dealDmg(u, f, sk.mult, { big: true }); fx('boom', f, { col: '#c4a3ff' }); }); }));
    },
    claw(u, sk, foes) { // 카렌: 체력 낮은 적 할퀴기 + 처형
      const tgt = foes.slice().sort((a, b) => a.hp / a.max - b.hp / b.max)[0];
      u.x = Math.max(u.x, tgt.x - .08);
      for (let k = 0; k < sk.hits; k++) later(k * .09, () => {
        const f = tgt.dead ? nearest(u, alive(B.mobs())) : tgt; if (!f) return;
        dealDmg(u, f, sk.mult); fx('claw', f, { flip: k % 2 });
        if (!f.dead && f.hp < f.max * .15 && !f.boss) { f.hp = 0; f.dead = true; f.dying = .01; float(f, '처형!', '#ff4d6a', true); onDeath(f, u); }
      });
    },
    beam(u, sk, foes) { // 하루: 관통 빔 (확정 치명타)
      fx('beam', u, { life: 1 });
      later(.12, () => alive(B.mobs()).forEach(f => dealDmg(u, f, sk.mult, { forceCrit: true })));
    },
    taunt(u, sk) { // 리안: 보호막 + 도발
      alive(B.heroes()).forEach(a => { a.shield += Math.floor(a.max * sk.mult); fx('dome', a); });
      u.taunt = 5; fx('taunt', u, { life: 1.5 });
    },
    song(u, sk) { // 미유: 회복 + 지속 회복
      alive(B.heroes()).forEach(a => { heal(a, u.atk * sk.mult, u); a.regen = { hps: u.atk * .35 * (u.passive === 'healUp' ? 1.3 : 1), t: 5, acc: 0 }; fx('notes', a); });
    },
    flame(u, sk, foes) { // 나리: 강타 + 화상
      const f = nearest(u, foes);
      u.x = Math.max(u.x, f.x - .08);
      fx('fireslash', f);
      later(.1, () => { dealDmg(u, f, sk.mult, { big: true }); if (!f.dead) f.burn = { dps: u.atk * .5, t: 4, acc: 0, src: u }; fx('boom', f, { col: '#ff7a3d', big: true }); });
    },
    freeze(u, sk, foes) { // 유나: 전체 피해 + 빙결
      foes.forEach(f => { fx('ice', f); later(.15, () => { dealDmg(u, f, sk.mult, { big: true }); if (!f.dead) f.frozen = f.raid ? .8 : 2.5; }); });
    },
    rain(u, sk) { // 소피: 화살비
      for (let k = 0; k < sk.hits; k++) later(k * .08, () => { const fs = alive(B.mobs()); if (!fs.length) return; const f = G.pick(fs); fx('arrow', f); later(.2, () => dealDmg(u, f, sk.mult)); });
    },
    fortress(u, sk) { // 베라: 피해 감소 + 보호막
      alive(B.heroes()).forEach(a => { a.reduceT = 6; a.reduceP = .35; fx('steel', a); });
      u.shield += Math.floor(u.max * sk.mult);
    },
    revive(u, sk) { // 아린: 부활 + 회복
      const dead = B.heroes().find(a => a.dead && a !== u);
      if (dead) { dead.dead = false; dead.dying = 0; dead.hp = Math.floor(dead.max * .4); dead.frozen = 0; fx('pillar', dead, { life: 1.4 }); float(dead, '부활!', '#fff3a0', true); }
      alive(B.heroes()).forEach(a => heal(a, u.atk * sk.mult, u));
    },
    spin(u, sk, foes) { // 도나: 회오리 + 넉백
      fx('spin', u);
      foes.forEach(f => { dealDmg(u, f, sk.mult, { big: true }); f.x = Math.min(.95, f.x + .08); });
    },
    smite(u, sk, foes) { // 아우렐리아: 성검 심판 + 아군 공격력 버프
      foes.forEach(f => { fx('pillar', f, { life: 1 }); later(.15, () => { dealDmg(u, f, sk.mult, { big: true }); fx('boom', f, { col: '#ffe08a', big: true }); }); });
      alive(B.heroes()).forEach(a => { a.rageT = Math.max(a.rageT, 5); fx('steel', a); });
    },
    sanctuary(u, sk) { // 엘리시아: 전체 회복 + 2초 무적
      alive(B.heroes()).forEach(a => { heal(a, u.atk * sk.mult, u); a.invulT = Math.max(a.invulT, 2); fx('pillar', a, { life: 1.2 }); });
    },
    foxfire(u, sk) { // 코하쿠: 여우불 (화상)
      for (let k = 0; k < sk.hits; k++) later(k * .12, () => { const fs = alive(B.mobs()); if (!fs.length) return; B.projs.push({ x: u.x, y: u.y - .15, src: u, tgt: G.pick(fs), kind: 'fox', mult: sk.mult, burn: true }); });
    },
    drain(u, sk, foes) { // 릴리스: 흡혈 강타
      const f = nearest(u, foes); u.x = Math.max(u.x, f.x - .08);
      later(.1, () => { const d = dealDmg(u, f, sk.mult, { big: true }); fx('claw', f); if (d > 0) heal(u, d * .5); });
    },
    overdrive(u) { u.hasteT = 5; fx('notes', u); }, // 네온: 공격 속도 2배
    bash(u, sk, foes) { // 레이나: 방패 강타 + 기절
      const f = nearest(u, foes); u.x = Math.max(u.x, f.x - .08);
      later(.1, () => { dealDmg(u, f, sk.mult, { big: true }); if (!f.dead) f.stun = f.raid ? .6 : 2; fx('boom', f, { col: '#ffd23f' }); });
    },
    aid(u, sk) { // 프림: 가장 약한 아군 치유 + 상태이상 해제
      const a = alive(B.heroes()).sort((x, y) => x.hp / x.max - y.hp / y.max)[0]; if (!a) return;
      heal(a, u.atk * sk.mult, u); a.burn = null; a.frozen = 0; a.stun = 0; fx('pillar', a, { life: 1 }); fx('heal', a);
    },
    chain(u, sk, foes) { // 셀레네: 연쇄 번개
      foes.slice().sort((a, b) => Math.abs(a.x - u.x) - Math.abs(b.x - u.x)).slice(0, 4).forEach((f, k) => later(k * .12, () => { dealDmg(u, f, sk.mult * (1 - k * .15)); fx('boom', f, { col: '#9fd0ff' }); }));
    },
    volley(u, sk) { // 모모: 4연발 (치명타 +30%)
      for (let k = 0; k < sk.hits; k++) later(k * .1, () => { const fs = alive(B.mobs()); if (!fs.length) return; const f = nearest(u, fs); B.projs.push({ x: u.x, y: u.y - .1, src: u, tgt: f, kind: 'bow', mult: sk.mult, critBonus: 30 }); });
    },
  };

  B.castSkill = function (i, manual) {
    const u = B.heroes()[i];
    if (!u || u.dead || u.skillT > 0 || u.frozen > 0 || B.ended) return false;
    const sk = u.def.skill, foes = alive(B.mobs());
    const support = ['taunt', 'song', 'fortress', 'revive', 'sanctuary', 'aid', 'overdrive'].includes(sk.type);
    if (!foes.length && !support) return false;
    if (sk.type === 'revive' && !B.heroes().some(a => a.dead) && !B.heroes().some(a => !a.dead && a.hp < a.max * .7)) { if (manual) G.UI.toast('지금은 회복할 아군이 없어요'); return false; }
    u.skillT = u.cd; u.anim = 1; u.castT = .7;
    fx('cast', u, { col: G.CGRADES[u.def.g].color, name: sk.n });
    G.UI.cutin && G.UI.cutin(u);
    SKILLS[sk.type](u, sk, foes);
    return true;
  };

  // 레이드 보스 패턴: 브레스 예고 → 전체 공격, 체력 30% 이하 분노
  function raidAI(u, dt) {
    const R = u.raid, info = G.RAIDS[R.key];
    if (!R.rage && u.hp < u.max * .3) { R.rage = true; u.spd *= .65; float(u, '분노!', '#ff3030', true); fx('roar', u, { life: 1.2 }); }
    if (R.warn > 0) {
      R.warn -= dt;
      if (R.warn <= 0) breath(u, info);
      return true;
    }
    R.breathT -= dt;
    if (R.breathT <= 0) {
      R.warn = 1.6; R.breathT = R.rage ? 6 : 9;
      fx('warn', u, { life: 1.6, col: info.breath });
      float(u, info.el + ' 브레스!', info.breath, true);
      return true;
    }
    return false;
  }
  function breath(u, info) {
    const hs = alive(B.heroes());
    fx('breath', u, { life: 1, col: info.breath });
    let total = 0;
    hs.forEach(h => {
      if (R_KEY(u) === 'nox' && h.shield > 0) { h.shield = 0; float(h, '보호막 파괴', '#c084fc'); }
      total += dealDmg(u, h, 1.6, { big: true });
      if (h.dead) return;
      if (R_KEY(u) === 'ignis') h.burn = { dps: u.atk * .3, t: 4, acc: 0, src: u };
    });
    if (R_KEY(u) === 'frost') hs.filter(h => !h.dead).sort(() => Math.random() - .5).slice(0, 2).forEach(h => { h.frozen = 1.8; fx('ice', h); });
    if (R_KEY(u) === 'nox' && total > 0) { const a = Math.floor(total * .5); u.hp = Math.min(u.max, u.hp + a); float(u, '+' + G.fmt(a), '#c084fc', true); }
  }
  const R_KEY = u => u.raid.key;

  function finish(win, reason) {
    if (B.ended) return;
    B.ended = true;
    const S = G.S, res = { win, reason, mode: B.mode, earned: B.earned, first: false };
    if (B.mode === 'stage') {
      const s = B.stage;
      if (win) {
        G.quest('stage');
        res.first = !S.cleared[s];
        S.cleared[s] = true;
        const g = G.mobGold(s) * 15, e = G.mobExp(s) * 10, st = Math.ceil(5 * (1 + G.tierOf(s)));
        S.gold += g; S.stones += st; G.gainExp(S, e);
        B.earned.gold += g; B.earned.exp += e; B.earned.stones = st;
        if (res.first) {
          const gems = s % 10 === 9 ? 100 : 30;
          S.gems += gems; B.earned.gems = gems;
          if (s % 10 === 9) { S.cubes += 3; B.earned.cubes = 3; }
          if (s % 10 === 9) G.news(`<b>${esc(S.name)}</b>님이 <span class="c-gold">${G.AREAS[Math.floor(s / 10)].boss[2]}</span>을(를) 처음으로 쓰러뜨렸습니다!`);
        }
        const it = G.dropEquip(S, G.tierOf(s), s % 10 === 9, s + 1);
        if (it) B.earned.items.push(it);
        if (s === S.maxStage && S.maxStage < G.MAX_STAGE) S.maxStage++;
      }
    } else if (B.mode === 'arena') {
      const rw = win ? { gems: 15, gold: G.mobGold(Math.max(5, S.maxStage)) * 5 } : { gems: 3 };
      S.gems += rw.gems; if (rw.gold) S.gold += rw.gold; Object.assign(B.earned, rw);
      res.opp = B.opp;
    } else if (B.mode === 'tower') {
      G.towerFinish(S, win, B.dmgDealt, B.floor, res, B.towerHp);
      if (res.rw) Object.assign(B.earned, res.rw);
      if (win && Math.random() < .35) { const it = G.dropEquip(S, G.tierOf(B.towerS), G.towerBoss(B.floor), B.towerS + 1); if (it) B.earned.items.push(it); }
    } else if (B.mode === 'raid') {
      const key = B.raidKey, lv = S.raid.lv[key], boss = B.mobs()[0];
      const ratio = boss ? Math.min(1, win ? 1 : B.dmgDealt / boss.max) : 0;
      const tier = G.RAID_TIERS.find(t => ratio >= t.min);
      const mult = 1 + (lv - 1) * .25, st = G.raidStage(lv);
      const got = { gems: Math.floor(tier.gems * mult), stones: Math.floor(tier.stones * mult), gold: Math.floor(G.mobGold(st) * tier.gold), cubes: tier.cubes };
      S.gems += got.gems; S.stones += got.stones; S.gold += got.gold; S.cubes += got.cubes;
      for (let k = 0; k < tier.box; k++) { const it = G.makeItem(S, G.pick(G.GEAR_SLOTS).id, G.roll(G.BOSS_DROP_RATES), G.tierOf(st), st + 1); if (G.addItem(S, it)) B.earned.items.push(it); }
      // 레이드 전용 악세서리 (단계가 높을수록 등급↑)
      G.ACC_DROP[tier.k].forEach(ch => { if (Math.random() < ch) { const a = G.makeAcc(S, key, lv); if (G.addItem(S, a)) { B.earned.items.push(a); res.acc = (res.acc || 0) + 1; } } });
      Object.assign(B.earned, got);
      const dmg = win ? boss.max : B.dmgDealt;
      res.newBest = dmg > (S.raid.best[key] || 0);
      if (res.newBest) S.raid.best[key] = dmg;
      if (win) { S.raid.lv[key]++; G.news(`<b>${esc(S.name)}</b>님의 파티가 <span class="c-gold">${G.RAIDS[key].n} Lv.${lv}</span>을(를) 토벌했습니다!`); }
      Object.assign(res, { raid: key, lv, dmg, ratio, tier: tier.k });
    } else {
      const key = B.dungeon, lv = S.dLv[key], rw = G.dungeonReward(key, lv);
      let got = {};
      if (win) { got = rw; S.dLv[key]++; }
      else if (key === 'gold') {
        const boss = B.mobs()[0], ratio = boss ? 1 - boss.hp / boss.max : 0;
        got = { gold: Math.floor(rw.gold * ratio * .6) };
      }
      if (got.gold) S.gold += got.gold;
      if (got.stones) S.stones += got.stones;
      if (got.gems) S.gems += got.gems;
      if (got.equip) {
        const it = G.makeItem(S, G.pick(G.GEAR_SLOTS).id, Math.min(5, 2 + G.roll([85, 13, 2])), G.tierOf(G.dungeonStage(lv)), G.dungeonStage(lv) + 1);
        if (G.addItem(S, it)) B.earned.items.push(it);
      }
      Object.assign(B.earned, got); res.dLv = lv;
    }
    // 영웅 레벨은 전투로 오르지 않아요 (골드로만 레벨업)
    res.heroExp = [];
    if (win && G.affGain) res.aff = B.heroes().map(u => ({ id: u.id, r: G.affGain(S, u.id, B.mode === 'raid' ? 3 : B.mode === 'dungeon' || B.mode === 'tower' ? 2 : 1, 'battle') })); // 함께 싸우면 호감도 상승
    B.result = res;
    G.save();
    setTimeout(() => G.UI.battleResult(res), 700);
  }
  B.quit = function () { B.ended = true; B.timers = []; };

  // ---------- 진행 ----------
  B.update = function (rdt) {
    if (B.ended) { tickFx(rdt); return; }
    const dt = rdt * (G.S.speed || 1);
    B.t += dt;
    // 지연 실행
    B.timers.forEach(tm => (tm.t -= dt));
    const due = B.timers.filter(tm => tm.t <= 0);
    B.timers = B.timers.filter(tm => tm.t > 0);
    due.forEach(tm => { if (!B.ended) tm.fn(); });
    B.timeLeft -= dt;
    if (B.timeLeft <= 0) { B.timeLeft = 0; return finish(false, B.mode === 'raid' ? '시간 종료' : '시간 초과'); }
    const heroes = alive(B.heroes()), mobs = alive(B.mobs());
    if (!heroes.length) return finish(false, '파티 전멸');
    if (!mobs.length) {
      heroes.forEach(u => { const dx = u.hx - u.x; if (Math.abs(dx) > .01) { u.x += Math.sign(dx) * Math.min(Math.abs(dx), MOVE * dt * 1.5); u.walk += dt; } u.y += (u.hy - u.y) * Math.min(1, dt * 3); });
      B.waveDelay += dt;
      if (B.waveDelay > 1.2 && !B.timers.length) {
        B.waveDelay = 0;
        if (B.wave >= B.waves.length - 1) return finish(true);
        nextWave();
      }
      tickFx(rdt); return;
    }
    const taunter = heroes.find(h => h.taunt > 0);
    B.units.forEach(u => {

    const S = G.S; G.towerCheck(S);

    const floors = []; for (let k = f + 4; k >= Math.max(1, f - 2); k--) floors.push(k);

    return `<h2>🗼 무한의 탑 <span class="muted">이번 주 ${f - 1}층 돌파</span></h2>

        <div class="tw-reset">⏳ 주간 초기화까지 ${dd}일 ${hh}시간 ${mm}분 (매주 월요일 0시)</div></div>

  // ---------- 순위표 (탑·아레나 공통) ----------
  function rankRows(list, kind) {
    if (!list || !list.length) return '<p class="muted" style="margin:6px 0">아직 이번 주 기록이 없어요. 첫 번째 주인공이 되어 보세요!</p>';
    return `<div class="rk-list">${list.map(r => `<div class="rk ${r.me ? 'me' : ''} ${r.rank <= 3 ? 'top' + r.rank : ''}"><span class="rk-n">${r.rank <= 3 ? ['🥇', '🥈', '🥉'][r.rank - 1] : r.rank}</span><b class="grow">${esc(r.name)}${r.me ? ' (나)' : ''}</b>
      <span class="rk-v">${kind === 'tower' ? `${r.floor}층 돌파${+r.pct ? ' + ' + (+r.pct).toFixed(1) + '%' : ''} · <b>${G.fmtScore(+r.score)}</b>` : `${r.wins}승 · <b>${G.fmt(+r.points)}점</b> <small>(${r.rating})</small>`}</span></div>`).join('')}</div>`;
  }
  function claimBtn(kind) {
    const key = kind + ':' + G.weekKey();
    return (G.S.netClaims || {})[key] ? '' : `<button class="btn sm gold" data-a="claimWeekly" data-v="${kind}">🎁 지난주 순위 보상 받기</button>`;
  }
  UI.loadRanks = function () {
    const box = $('rankBox'); if (!box || !G.Net.on()) return;
    const kind = box.dataset.kind;
    const p = kind === 'tower' ? G.Net.submitTower().then(() => G.Net.towerBoard()) : Promise.resolve(G.Net.arena);
    p.then(d => {
      if (!$('rankBox')) return;
      const me = kind === 'tower' ? d.me : d.me, list = kind === 'tower' ? d.list : d.board;
      $('rankBox').innerHTML = `<div class="rk-me">내 순위 <b>${me && me.rank ? me.rank + '위' : '-'}</b>${kind === 'tower' && me ? ` / ${me.total}명` : ''} ${claimBtn(kind)}</div>${rankRows(list, kind)}`;
    }).catch(e => { if ($('rankBox')) $('rankBox').innerHTML = `<p class="muted">${G.Net.say(e)}</p><button class="btn sm" data-a="render">다시 시도</button>`; });
  };

  // ---------- 아레나 ----------

    const S = G.S;

      <p class="muted" style="margin-top:-4px">다른 유저의 <b>방어 파티</b>와 싸워요. 내 방어 파티는 지금 편성한 파티로 자동 등록돼요. 하루 ${G.ARENA_DAILY}번 · 승리 💎15 · 패배 💎3 · 이길수록 주간 점수↑</p>
      <div id="arenaBox"><div class="panel"><p class="muted">상대를 찾는 중…</p></div></div>
      <div class="panel tw-rank"><b>🏆 주간 아레나 순위</b><div id="rankBox" data-kind="arena" class="rank-box"><p class="muted">불러오는 중…</p></div>
        <div class="tw-rw" style="margin-top:8px">${G.TOWER_RANK_RW.map(x => `<div><b>${x.r}</b><span>💎${G.fmt(x.gems)}${x.cubes ? ' 🎲' + x.cubes : ''}</span></div>`).join('')}</div>

          <div class="tw-reset">통산 ${me.wins || 0}승 ${me.losses || 0}패 · 내 전투력 ⚔ ${G.fmt(G.partyPower(G.S))}</div></div>
        <div class="ar-list">${d.opps.length ? d.opps.map((o, i) => `<div class="ar-op"><div class="ar-team">${(o.team || []).slice(0, 5).map(t => G.HERO_MAP[t.id] ? `<canvas class="ar-bust" data-h="${t.id}" data-c="${t.costume}"></canvas>` : '').join('')}</div>

  // ---------- 레이드 ----------
  SCREENS.raid = function () {

        { cat: '💰 골드', id: 'gold10', icon: '💰', n: '골드 금고', d: `💰${G.fmt(G.mobGold(G.S.maxStage) * 3300)} · 10% 보너스`, cost: 500, cur: 'gems' },

  }

        <div class="panel"><div class="row"><span class="grow">🎯 천장: ${G.PITY}회 안에 <b style="color:${G.CGRADES[3].color}">UR</b> 확정</span><b>${S.pity}/${G.PITY}</b></div>

    return `<h2>👙 의상 뽑기</h2>${tabs}
      <div class="banner cos-banner"><div class="bn-chars">${bust('haru', 'haru_swim', 'data-full="1" data-nobg="1"')}${bust('miyu', 'miyu_santa', 'data-full="1" data-nobg="1"')}${bust('karen', 'karen_hallo', 'data-full="1" data-nobg="1"')}${bust('seraphine', 'seraphine_idol', 'data-full="1" data-nobg="1"')}</div>
        <div class="bn-txt"><span class="cg" style="background:${G.CGRADES[2].color}">NEW</span><b class="stroke">시즌 의상 컬렉션</b><small>수영복 · 산타 · 할로윈 · 아이돌 ${n2 + n3}종</small></div></div>
      <div class="row" style="margin:10px 0 8px">
        <button class="btn purple grow" data-a="pullCos" data-v="1">1회 뽑기<br><small>💎 ${G.COSTUME_COST.one}</small></button>
        <button class="btn gold grow" data-a="pullCos" data-v="10">10회 뽑기<br><small>💎 ${G.COSTUME_COST.ten}</small></button></div>
      <h3>📜 확률 공개</h3><div class="panel">
        <div class="kv"><span>${cgTag(2)} 썸머 바캉스 · 홀리 산타 · 할로윈 나이트</span><b>${G.COSTUME_RATES[2]}% <span class="muted">(각 ${(G.COSTUME_RATES[2] / n2).toFixed(2)}%)</span></b></div>
        <div class="kv"><span>${cgTag(3)} 스테이지 아이돌</span><b>${G.COSTUME_RATES[3]}% <span class="muted">(각 ${(G.COSTUME_RATES[3] / n3).toFixed(2)}%)</span></b></div>
        <div class="cb-sum" style="margin-top:8px">✨ 현재 보유 효과 (전체 영웅): ${cbText() || '아직 없음'}</div>
        <p class="muted" style="margin:8px 0 0">의상마다 <b>보유 효과</b>가 있어서 가지고만 있어도 모든 영웅이 강해져요 (수영복 공격력, 산타 체력, 할로윈 치명타, 아이돌 공격력·체력). 해당 영웅이 없어도 보관돼요. 중복이면 💎${G.COSTUME_DUP_GEMS[2]} / 💎${G.COSTUME_DUP_GEMS[3]}로 돌려받아요.</p></div>`;
  };
  // 등급별 연출 색: R 회색 · SR 파랑 · SSR 금색 · UR 붉은빛
  const PULL_FX = ['#b8c0cc', '#5aa8ff', '#ffc83d', '#ff2d2d'];
  // 모든 카드 뒷면은 똑같이 → 터치해서 열어야 등급을 알 수 있음
  function pullCard(g, inner, i) {
    return `<div class="pr fx${g}" data-a="flip" data-g="${g}" style="--gc:${G.CGRADES[g].color};--fx:${PULL_FX[g]};animation-delay:${i * .05}s">${inner}<div class="pr-beam"></div><div class="pr-back"><span>✦</span><small>TOUCH</small></div></div>`;
  }
  function openCard(el, quiet) {
    if (!el || el.classList.contains('open') || el.classList.contains('charging')) return;
    if (Number(el.dataset.g) >= 3) { // UR: 아우라 충전 연출 후 열림
      el.classList.add('charging');
      setTimeout(() => { el.classList.remove('charging'); finishOpen(el, false); }, 1150);
      return;
    }
    finishOpen(el, quiet);
  }
  function finishOpen(el, quiet) {
    el.classList.add('open');
    const g = Number(el.dataset.g);
    if (!quiet && g >= 2) revealFlash(g);
    const left = document.querySelectorAll('#sheet .pr:not(.open)').length, lb = $('pullLeft');
    if (lb) lb.textContent = left ? `남은 카드 ${left}장` : '모두 열었어요!';
    if (!left) { const sk = $('pullSkipBtn'); if (sk) sk.disabled = true; }
  }
  function revealFlash(g) { // 열린 카드가 SSR이면 금빛, UR이면 붉은 빛 연출
    const f = document.createElement('div');
    f.className = 'reveal-flash fx' + g;
    f.innerHTML = `<div class="ur-txt ${g === 2 ? 'ssr' : ''}">${g >= 3 ? 'UR!!' : 'SSR!'}</div>`;
    document.body.appendChild(f);
    setTimeout(() => f.remove(), g >= 3 ? 1300 : 900);
  }
  function pullResult(cards, title, act, n) {
    const cost = act === 'pull' ? (n === 10 ? G.GACHA_COST.ten : G.GACHA_COST.one) : (n === 10 ? G.COSTUME_COST.ten : G.COSTUME_COST.one);
    const intro = `<div class="pull-intro"><div class="orb"></div></div>`; // 등급과 상관없는 같은 연출
    UI.modal(`${intro}<div class="row" style="margin-bottom:8px"><h3 class="mt grow" style="margin:0">${title}</h3><span class="muted" id="pullLeft" style="font-size:12px">카드를 터치해서 열어보세요</span>
        <button class="btn sm" id="pullSkipBtn" data-a="pullOpenAll">⏭ 모두 열기</button></div><div class="pull-grid">${cards}</div>
      <div class="row" style="margin-top:12px"><button class="btn grow" data-a="close">확인</button>
        <button class="btn gold grow" data-a="${act}" data-v="${n}" ${G.S.gems < cost ? 'disabled' : ''}>🔁 다시 뽑기 <small>💎${cost}</small></button></div>`, true);
  }

  // ---------- 설정 ----------
  SCREENS.settings = function () {
    return `<h2>⚙️ 설정</h2>
      <div class="panel"><b>💾 저장 데이터</b><p class="muted">진행 상황은 이 브라우저에 자동 저장돼요. 다른 기기로 옮기려면 코드를 복사해 불러오세요.</p>

        <textarea id="saveCode" placeholder="여기에 저장 코드를 붙여넣고 [불러오기]" style="margin-top:8px"></textarea>
        <div class="row" style="margin-top:6px"><button class="btn sm grow" data-a="copySave">📋 복사</button><button class="btn sm gold grow" data-a="importSave">📥 불러오기</button></div></div>
      <div class="panel"><b>⚠️ 초기화</b><p class="muted">모든 진행 상황이 삭제돼요.</p><button class="btn sm red" data-a="wipe">데이터 초기화</button></div>
      <p class="muted" style="text-align:center">아스트라 RPG v${G.VERSION}</p>`;
  };

  UI.offlineModal = function (off) {
    UI._off = off;
    const h = Math.floor(off.capped / 3600), m = Math.floor((off.capped % 3600) / 60);
    UI.modal(`<div style="text-align:center"><div style="font-size:44px">🌙</div><h3 class="mt">오프라인 자동 사냥 보상</h3>
      <p class="muted">${h}시간 ${m}분 동안 파티가 사냥했어요${off.sec > off.capped ? ` (최대 ${G.OFFLINE_CAP_H}시간)` : ''}</p></div>
      <div class="kv"><span>골드</span><b>💰 ${G.fmt(off.gold)}</b></div><div class="kv"><span>경험치</span><b>✨ ${G.fmt(off.exp)}</b></div>
      <div class="kv"><span>강화석</span><b>💠 ${G.fmt(off.stones)}</b></div><div class="kv"><span>장비</span><b>🎁 ${off.equips}개</b></div>
      <div class="row" style="margin-top:12px"><button class="btn grow" data-a="claimOff" data-v="1">받기</button>
        <button class="btn gold grow" data-a="claimOff" data-v="2" ${G.S.gems < 50 ? 'disabled' : ''}>2배 받기 (💎50)</button></div>`);

  function startStage(s) {
    const S = G.S;
    if (!S.party.length) { UI.toast('파티에 영웅을 넣어주세요', 'bad'); return UI.go('party'); }
    UI.close();
    UI.stageSel = s; UI.stageCh = Math.floor(s / 10);
    G.storyBefore(s, () => { G.Battle.start('stage', s); UI.go('battle'); });
  }

  // ---------- 액션 ----------
  const A = {
    go: v => { UI.close(); UI.go(v); },
    close: () => UI.close(),
    goTownNow: () => { stopAuto(); UI.close(); UI.go('town'); },
    confirmOk: () => { UI.close(); UI._confirmFn && UI._confirmFn(); },
    shopGo: v => { UI.shopTab = v; UI.go('shop'); },
    gachaGo: v => { UI.gachaTab = v; UI.go('gacha'); },
    heroTap: (v, el, e) => { const r = el.getBoundingClientRect(); if (!G.Lobby.tap(e.clientX - r.left, e.clientY - r.top)) G.Lobby.wave = 1; },
    social: v => UI.toast(`👥 ${v}는 온라인 서버를 붙인 뒤 열릴 예정이에요`),
    // 모험
    stageCh: v => { UI.stageCh = Number(v); UI.stageSel = Math.min(G.S.maxStage, UI.stageCh * 10 + 9); if (UI.stageSel < UI.stageCh * 10) UI.stageSel = UI.stageCh * 10; UI.render(); },
    stageSel: v => { UI.stageSel = Number(v); UI.render(); },
    startStage: v => startStage(Number(v)),
    towerGo: v => startTower(Number(v)),
    render: () => UI.render(),
    claimWeekly: kind => G.Net.claimWeekly(kind).then(r => {
      if (r.claimed) UI.toast('이미 받은 보상이에요');
      else if (r.rank == null) UI.toast('지난주 순위 기록이 없어요');
      else UI.toast(`🏆 지난주 ${r.rank}위 보상 💎${r.gems}${r.cubes ? ' 🎲' + r.cubes : ''}`, 'rare');
      UI.render();
    }).catch(e => UI.toast(G.Net.say(e), 'bad')),
    arenaFight: i => { const o = G.Net.arena && G.Net.arena.opps[Number(i)]; if (!o) return; G.Battle.start('arena', o); UI.go('battle'); },
    towerClaim: () => { const g = G.towerClaimLast(G.S); G.save(); if (g) UI.toast(`📅 지난주 탑 정산 💎${g}`, 'rare'); UI.render(); },
    storyPlay: v => { const [c, p] = v.split(':'); G.Story.play(Number(c), p, null, { replay: true }); },
    retry: () => { const B = G.Battle; UI.close(); if (B.mode === 'stage') startStage(B.stage); else if (B.mode === 'tower') startTower(B.floor); else if (B.mode === 'arena') UI.go('arena'); else UI.go('dungeon'); },
    skill: v => { if (!G.Battle.castSkill(Number(v), true) && !G.Battle.ended) { const u = G.Battle.heroes()[v]; if (u && !u.dead && u.skillT > 0) UI.toast(`${u.def.skill.n} 준비 중 (${Math.ceil(u.skillT)}초)`); } },
    speed: () => { G.S.speed = G.S.speed === 2 ? 1 : 2; UI.updateBattle(); },
    autoSkill: () => { G.S.auto = !G.S.auto; UI.updateBattle(); UI.toast(G.S.auto ? '스킬 자동 사용 ON' : '스킬 자동 사용 OFF'); },
    quitBattle: () => G.Battle.mode === 'arena' ? UI.confirm('아레나 포기', '지금 나가면 패배로 기록돼요. 나갈까요?', '나가기', () => { const o = G.Battle.opp; G.Battle.quit(); G.Net.arenaFight(o.user_id, false).catch(() => {}); UI.go('arena'); }, 'red') : UI.confirm('전투 나가기', G.Battle.mode === 'raid' ? '레이드를 포기할까요? 입장권은 돌려받지 못하고 보상도 없어요.' : '진행 중인 전투를 포기할까요? (잡은 몬스터 보상은 유지돼요)', '나가기', () => { G.Battle.quit(); UI.go(G.Battle.mode === 'stage' ? 'stages' : G.Battle.mode === 'tower' ? 'tower' : G.Battle.mode === 'raid' ? 'raid' : 'dungeon'); }, 'red'),
    enterDungeon: k => {
      const S = G.S; if (S.tickets[k] <= 0) return;
      if (!S.party.length) return UI.toast('파티에 영웅을 넣어주세요', 'bad');
      S.tickets[k]--; G.quest('dungeon'); G.Battle.start('dungeon', k); UI.go('battle'); G.save();
    },

      S[p.cur] -= p.cost;
      const t = G.tierOf(S.maxStage);
      if (id === 'stone10') S.stones += 10;
      else if (id === 'stone100') S.stones += 100;
      else if (id === 'tickets') { for (const k in S.tickets) S.tickets[k]++; }

      else if (id === 'cube30') S.cubes += 30;
      else if (id === 'stone500') S.stones += 500;
      else if (id === 'gold1' || id === 'gold10') S.gold += G.mobGold(S.maxStage) * (id === 'gold1' ? 300 : 3300);
      else {
        const n = /30$/.test(id) ? 30 : /10$/.test(id) ? 10 : 1, got = [];
        for (let i = 0; i < n; i++) { const it = G.makeItem(S, G.pick(G.SLOTS).id, G.roll(/^bossbox/.test(id) ? G.BOSS_DROP_RATES : G.DROP_RATES), t); if (G.addItem(S, it)) got.push(it); }
        got.sort((a, b) => b.g - a.g);
        const cur = p.cur === 'gold' ? '💰' : '💎', left = S[p.cur], again = left >= p.cost && S.items.length + n <= G.bagMax(S);
        UI.modal(`<h3 class="mt">📦 ${p.n} 개봉</h3><div class="items">${got.map(it => itemBox(it, { act: 'item' })).join('')}</div>

      }
      if (!/box/.test(id)) UI.toast(`${p.n} 구매 완료${/^gold/.test(id) ? ' ' + p.d.split(' ')[0] : ''}`, 'good');
      G.save(); UI.render();
